<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
</head>
<body>
    <div class="converter-card">
        <h2 class="title">Temperature Conversion</h2>
        <div class="converter-body">
            <div class="input-group">
                <input id="input1" type="number" class="input" placeholder="0">
                <select id="select1" name="select1" class="select">
                    <option value="celsius">°C - Celsius</option>
                    <option value="fahrenheit">°F - Fahrenheit</option>
                    <option value="kelvin">K - Kelvin</option>
                </select>
            </div>
            <span class="separator">=</span>
            <div class="input-group">
                <input id="input2" type="number" class="input" placeholder="0">
                <select id="select2" name="select2" class="select">
                    <option value="celsius">°C - Celsius</option>
                    <option value="fahrenheit">°F - Fahrenheit</option>
                    <option value="kelvin">K - Kelvin</option>
                </select>
            </div>
        </div>
    </div>
</body>
</html>
